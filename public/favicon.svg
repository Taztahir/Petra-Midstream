<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background square with rounded corners -->
  <rect width="64" height="64" rx="12" fill="#0f172a"/>

  <!-- Main 'P' body in muted slate blue -->
  <path d="M14 10 L14 54 L22 54 L22 38 L36 38 C44.8 38 52 30.8 52 22 C52 13.2 44.8 6 36 6 L14 6 Z" fill="#1e293b"/>

  <!-- P bowl cutout -->
  <ellipse cx="36" cy="22" rx="9" ry="10" fill="#0f172a"/>

  <!-- Orange pipeline stroke along the P outline -->
  <!-- Vertical stem pipe -->
  <rect x="14" y="10" width="7" height="44" rx="3.5" fill="#f97316"/>

  <!-- P bowl as pipeline curve -->
  <!-- Top horizontal -->
  <rect x="18" y="10" width="18" height="7" rx="3.5" fill="#f97316"/>
  <!-- Right vertical arc area - outer curve -->
  <path d="M34 13 Q50 13 50 22 Q50 31 34 31" stroke="#f97316" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- Bottom horizontal of bowl -->
  <rect x="18" y="28" width="18" height="7" rx="3.5" fill="#f97316"/>

  <!-- Pipeline joint dots (connectors) -->
  <circle cx="21" cy="13.5" r="3" fill="#0f172a"/>
  <circle cx="21" cy="31.5" r="3" fill="#0f172a"/>

  <!-- Accent highlight on P bowl top-right -->
